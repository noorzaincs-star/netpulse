[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "netpulse"
version = "0.1.0"
description = "Local-first network monitoring and diagnostics"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite==0.21.0",
    "anyio==4.8.0",
    "dnspython==2.7.0",
    "fastapi==0.115.8",
    "pydantic==2.14.2",
    "psutil==7.0.0",
    "python-dotenv==1.2.4",
    "sqlalchemy==2.0.38",
    "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
test = [
    "httpx==0.28.1",
    "pytest==8.3.4",
    "pytest-asyncio==0.25.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["netpulse*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
