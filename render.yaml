services:
  - type: web
    name: netpulse-backend
    runtime: python
    rootDir: backend
    plan: free
    healthCheckPath: /api/health
    buildCommand: "python -m pip install -r requirements-lock.txt && python -m pip install --no-deps -e ."
    startCommand: "uvicorn netpulse.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: CORS_ORIGINS
        sync: false
      - key: NETPULSE_DEMO
        value: true
      - key: ADMIN_TOKEN
        generateValue: true
      - key: NETPULSE_DATABASE_URL
        value: sqlite+aiosqlite:///./netpulse.db
